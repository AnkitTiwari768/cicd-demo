name: Ankit Tiwari

on:
  push:
    branches:
      - cicd

  pull_request:
    branches:
      - main
      - cicd

jobs:
  test:

    runs-on: windows-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql
          coverage: none

      - name: Check PHP version
        run: php -v

      - name: Check Composer
        run: composer --version

      - name: Run tests
        run: php artisan test
